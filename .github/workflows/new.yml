name: Build LuCI Only

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: openwrt_24_ipk
            label: OpenWrt 24.10 IPK
          - id: openwrt_25_apk
            label: OpenWrt 25.12 APK
            # apk 为可选项：25.x 的 APK 构建比 24.10 更严格，失败不影响 ipk 发布
            continue-on-error: true

    steps:
      - name: Install dependencies
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Import SDK environment
        id: sdk_env
        run: |
          # 动态读取对应的 env 文件
          source_file="source/.github/workflows/${{ matrix.id }}.env"
          cat "$source_file" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            echo "${key,,}=${value}" >> "$GITHUB_OUTPUT"
          done < "$source_file"

      - name: Initialize SDK
        env:
          SDK_FILE: ${{ steps.sdk_env.outputs.sdk_name }}.${{ steps.sdk_env.outputs.sdk_ext }}
          SDK_SOURCE: ${{ steps.sdk_env.outputs.sdk_url }}${{ steps.sdk_env.outputs.sdk_name }}.${{ steps.sdk_env.outputs.sdk_ext }}
        run: |
          wget -q "$SDK_SOURCE"
          mkdir -p sdk
          if [ "${SDK_EXT}" = "tar.zst" ]; then
            tar --zstd -xf "$SDK_FILE" -C sdk --strip-components=1
          else
            tar -xf "$SDK_FILE" -C sdk --strip-components=1
          fi

          cd sdk
          cat <<EOF > feeds.conf
          src-git base https://github.com/openwrt/openwrt.git;${FEED_BRANCH}
          src-git packages https://github.com/openwrt/packages.git;${FEED_BRANCH}
          src-git luci https://github.com/openwrt/luci.git;${FEED_BRANCH}
          src-git routing https://git.openwrt.org/feed/routing.git;${FEED_BRANCH}
          src-link vohive $(pwd)/../source
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 只配置 luci-app-vohive，不配置核心
          cat <<'EOF' > .config
          CONFIG_PACKAGE_luci-app-vohive=m
          EOF
          make defconfig

      - name: Compile LuCI App
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update vohive
          ./scripts/feeds install -a -p vohive

          # 只编译 luci-app-vohive；日志 tee 到 /tmp/compile.log 供失败排查，
          # pipefail 保证编译失败时该步骤仍会被判定失败（ipk 走严格，apk 由 continue-on-error 兜底）
          make package/feeds/vohive/luci-app-vohive/compile V=s 2>&1 | tee /tmp/compile.log

      - name: Collect packages
        if: always()
        run: |
          set -eu
          mkdir -p dist
          find sdk/bin -name "*.${{ steps.sdk_env.outputs.package_ext }}" -exec cp {} dist/ \; 2>/dev/null || true

      - name: Record APK build status
        if: always()
        run: |
          set -eu
          mkdir -p dist
          if [ "${{ matrix.id }}" = "openwrt_25_apk" ] && ! find dist -name '*.apk' | grep -q .; then
            {
              echo "APK 构建未产出 .apk 包（OpenWrt 25.12 分支）。"
              echo ""
              echo "**常见原因**：25.x 的 APK 构建比 24.10 更严格（luci.mk / 包签名 / conffiles / 符号链接等），"
              echo "或 VoHive core 下载失败、SDK 下载/解压失败。"
              echo ""
              echo "**末尾 80 行编译日志：**"
              echo '```'
              tail -n 80 /tmp/compile.log 2>/dev/null || true
              echo '```'
              echo ""
              echo "完整日志请查看本次 workflow run 的 \`Build OpenWrt 25.12 APK\` 任务。"
            } > dist/APK_FAILURE.md
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-vohive-${{ matrix.id }}
          path: dist

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release notes
        run: |
          set -eu
          {
            echo "## luci-app-vohive 发布构建"
            echo
            echo "包含 OpenWrt 24.10 (ipk) 与 25.12 (apk) 产物（apk 构建成功时）。"
            echo
            if [ -f artifacts/APK_FAILURE.md ]; then
              echo "## ⚠️ APK 构建状态"
              echo
              echo "本次发布**未包含** OpenWrt 25.12 (apk) 包。原因如下："
              echo
              cat artifacts/APK_FAILURE.md
            fi
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artifacts/*
